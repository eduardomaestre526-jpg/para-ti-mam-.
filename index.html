<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mamá</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(ellipse at 50% 72%, rgba(132, 54, 19, 0.30), transparent 48%),
                radial-gradient(ellipse at 50% 100%, #1b0b06 0%, #080403 48%, #010101 100%);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: 'Cormorant Garamond', serif;
            user-select: none;
        }

        #sceneCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .message-overlay {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 820px;
            margin-top: 5.5vh;
            text-align: center;
            pointer-events: none;
        }

        .message-line {
            font-size: clamp(1.35rem, 2.6vw, 2rem);
            line-height: 1.55;
            color: #fceade;
            text-shadow: 0 0 22px rgba(255, 175, 75, 0.45), 0 3px 10px rgba(0, 0, 0, 0.98);
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 1.8s cubic-bezier(0.25, 1, 0.5, 1), transform 1.8s cubic-bezier(0.25, 1, 0.5, 1);
            margin-bottom: 12px;
            letter-spacing: 0.6px;
        }

        .message-line.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .message-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.75rem, 3.5vw, 2.55rem);
            color: #ff3355;
            text-shadow: 0 0 28px rgba(255, 51, 85, 0.65), 0 4px 12px rgba(0, 0, 0, 0.98);
            margin-top: 16px;
            letter-spacing: 3.5px;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 210px rgba(0, 0, 0, 0.94);
            pointer-events: none;
            z-index: 3;
        }

        /* Grano cinematográfico muy sutil: evita que el fondo se vea plano. */
        .film-grain {
            position: fixed;
            inset: -50%;
            width: 200%;
            height: 200%;
            pointer-events: none;
            z-index: 4;
            opacity: .075;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E");
            animation: grainDrift .5s steps(2) infinite;
        }
        @media (max-width: 700px) { .film-grain { animation: none; opacity: .10; } }
        @keyframes grainDrift { 0% { transform: translate(0,0); } 25% { transform: translate(-1%,1%); } 50% { transform: translate(1%,-1%); } 75% { transform: translate(-1%,-1%); } 100% { transform: translate(1%,1%); } }
        @media (max-width: 600px) {
            .message-overlay { margin-top: 4vh; width: 94%; }
            .message-line { line-height: 1.35; margin-bottom: 9px; }
            .message-title { letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <div class="message-overlay">
        <p class="message-line" id="msg1">Mamá, sé que esto es poco en comparación con todo lo que de verdad te quiero dar...</p>
        <p class="message-line" id="msg2">Aunque aún no tenga el chance, este es mi regalo para ti.</p>
        <p class="message-line" id="msg3">Lo hice con mucho amor y espero que de verdad te guste.</p>
        <p class="message-line message-title" id="msg4">¡Feliz Cumpleaños!</p>
    </div>

    <canvas id="sceneCanvas"></canvas>
    <div class="vignette"></div>
    <div class="film-grain"></div>

    <script>
        const canvas = document.getElementById('sceneCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, dpr;
        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, window.innerWidth < 700 ? 1.25 : 1.6);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        const startTime = performance.now();
        let rotationAngle = 0;
        let ambientLight = 0;
        let textTriggered = false;
        const clamp = v => Math.max(0, Math.min(255, Math.round(v)));

        // Configuración de las 6 velas
        const numCandles = 6;
        const candles = [];
        for (let i = 0; i < numCandles; i++) {
            candles.push({
                angleOffset: (i / numCandles) * Math.PI * 2,
                lit: false,
                litProgress: 0,
                flickerSeed: i * 37.5 + Math.random() * 50
            });
        }

        // Sistema de partículas: brasas, chispas y humo con deriva orgánica.
        const particles = [];
        function spawnParticle(x, y, type) {
            if (particles.length > (window.innerWidth < 700 ? 145 : 230)) return;
            if (type === 'spark') {
                particles.push({ x, y,
                    vx: (Math.random() - 0.5) * 3.8,
                    vy: -Math.random() * 4.2 - 0.8,
                    gravity: 0.012 + Math.random() * 0.018,
                    life: 1, decay: 0.012 + Math.random() * 0.025,
                    size: 0.8 + Math.random() * 2.4, type: 'spark', phase: Math.random() * 6.28 });
            } else if (type === 'ember') {
                particles.push({ x, y, vx: (Math.random() - 0.5) * 1.2,
                    vy: -0.45 - Math.random() * 1.5, gravity: -0.002,
                    life: 1, decay: 0.004 + Math.random() * 0.008,
                    size: 1 + Math.random() * 2.1, type: 'ember', phase: Math.random() * 6.28 });
            } else if (type === 'smoke') {
                particles.push({ x: x + (Math.random() - 0.5) * 7, y: y - 8,
                    vx: (Math.random() - 0.5) * 0.8, vy: -0.48 - Math.random() * 0.7,
                    gravity: -0.001, life: 1, decay: 0.0035 + Math.random() * 0.004,
                    size: 5 + Math.random() * 9, type: 'smoke', phase: Math.random() * 6.28 });
            }
        }

        // Polvo luminoso ambiental, muy discreto, para dar profundidad al plano.
        const dust = Array.from({ length: window.innerWidth < 700 ? 22 : 38 }, () => ({
            x: Math.random() * (window.innerWidth || 1200),
            y: Math.random() * (window.innerHeight || 800),
            r: 0.35 + Math.random() * 1.15,
            speed: 0.08 + Math.random() * 0.28,
            phase: Math.random() * Math.PI * 2
        }));

        // Llama de contorno continuo: formas redondeadas y núcleo cálido sin puntas duras.
        function drawCinematicFlame(x, y, scale, time, seed = 0) {
            if (scale <= 0.01) return;
            const sway = Math.sin(time * 0.009 + seed) * 2.1 + Math.sin(time * 0.017 + seed * 1.3) * 0.9;
            const pulse = 0.97 + Math.sin(time * 0.022 + seed) * 0.025;
            const h = 48 * pulse;
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Halo suave, más contenido para evitar el aspecto de una mancha blanca.
            const halo = ctx.createRadialGradient(sway * .2, -19, 2, sway * .2, -19, 49);
            halo.addColorStop(0, 'rgba(255,205,112,.27)');
            halo.addColorStop(.48, 'rgba(255,117, thirty,0)'.replace('thirty','30'));
            halo.addColorStop(1, 'rgba(255,70,10,0)');
            ctx.fillStyle = halo;
            ctx.beginPath(); ctx.arc(sway * .2, -19, 49, 0, Math.PI * 2); ctx.fill();

            // Silueta principal: punta redondeada, laterales orgánicos y base ancha.
            ctx.beginPath();
            ctx.moveTo(-8, 1);
            ctx.bezierCurveTo(-18, -7, -17 + sway * .25, -20, -10 + sway * .55, -34);
            ctx.bezierCurveTo(-6 + sway * .8, -42, -1 + sway, -h - 1, sway + 2, -h);
            ctx.bezierCurveTo(sway + 8, -h + 2, 12 + sway, -39, 15 + sway * .45, -26);
            ctx.bezierCurveTo(20 + sway * .2, -13, 15, -4, 7, 1);
            ctx.quadraticCurveTo(0, 4, -8, 1);
            const outer = ctx.createLinearGradient(0, 2, sway, -h);
            outer.addColorStop(0, '#c52c08'); outer.addColorStop(.28, '#f45a0d');
            outer.addColorStop(.68, '#ffad32'); outer.addColorStop(1, '#ffd878');
            ctx.fillStyle = outer; ctx.shadowColor = 'rgba(255,110,20,.28)'; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0;

            // Lengua interior naranja, también curva y sin vértices afilados.
            ctx.beginPath();
            ctx.moveTo(-5, 0);
            ctx.bezierCurveTo(-10, -10, -7, -22, -2 + sway * .25, -32);
            ctx.bezierCurveTo(1 + sway * .4, -37, 4 + sway * .5, -39, 6 + sway * .4, -40);
            ctx.bezierCurveTo(12, -28, 12, -15, 7, -5);
            ctx.quadraticCurveTo(2, 2, -5, 0);
            const mid = ctx.createLinearGradient(0, 0, 2, -40);
            mid.addColorStop(0, '#f05a0b'); mid.addColorStop(.55, '#ffb52e'); mid.addColorStop(1, '#ffe49a');
            ctx.fillStyle = mid; ctx.fill();

            // Centro luminoso difuso: amarillo marfil, sin punto blanco ni azul intenso.
            ctx.beginPath();
            ctx.moveTo(-3.5, -1);
            ctx.bezierCurveTo(-7, -9, -4.5, -20, -1, -28);
            ctx.bezierCurveTo(1, -33, 3, -35, 4.5, -36);
            ctx.bezierCurveTo(8, -26, 8, -14, 4, -5);
            ctx.quadraticCurveTo(1, 0, -3.5, -1);
            const core = ctx.createLinearGradient(0, 0, 2, -36);
            core.addColorStop(0, 'rgba(255,173,45,.96)');
            core.addColorStop(.48, 'rgba(255,220,112,.96)');
            core.addColorStop(.86, 'rgba(255,239,190,.82)');
            core.addColorStop(1, 'rgba(255,244,210,.35)');
            ctx.fillStyle = core; ctx.fill();

            // Base azul muy pequeña y translúcida, integrada en la mecha.
            ctx.beginPath();
            ctx.ellipse(0, -1.8, 3.2, 3.8, 0, 0, Math.PI * 2);
            const base = ctx.createRadialGradient(0, -2, .2, 0, -2, 4.2);
            base.addColorStop(0, 'rgba(170,205,255,.55)');
            base.addColorStop(.55, 'rgba(75,135,220,.30)');
            base.addColorStop(1, 'rgba(50,95,180,0)');
            ctx.fillStyle = base; ctx.fill();
            ctx.restore();
        }

        // Renderizado de cada piso de la torta con oclusión ambiental y sombras direccionales
        function drawCinemaCakeTier(cx, cy, radiusX, radiusY, heightPx, rot, lightLevel, tierIndex, flickerWave) {
            const topY = cy - heightPx;
            const lightShiftX = Math.sin(flickerWave * 1.7) * 5; // La sombra se mueve sutilmente con el fuego

            // 1. Sombra de oclusión ambiental suave (penumbra cinematográfica)
            ctx.save();
            ctx.filter = `blur(${Math.max(4, radiusY * 0.24)}px)`;
            ctx.beginPath();
            ctx.ellipse(cx + lightShiftX, cy + 7, radiusX * 1.07, radiusY * 1.05, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(12, 3, 1, ${0.65 * lightLevel})`;
            ctx.fill();
            ctx.restore();

            // 2. Sombra de contacto dura justo debajo del borde del piso
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(cx + lightShiftX * 0.4, cy + 3, radiusX * 1.02, radiusY * 1.02, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 0, 0, ${0.88 * lightLevel})`;
            ctx.fill();
            ctx.restore();

            // 3. Cuerpo cilíndrico de crema con iluminación cálida central y bordes en penumbra
            const dynamicPulse = 1 + Math.sin(flickerWave) * 0.035;
            const baseCol = 232 * lightLevel * dynamicPulse;
            const bodyGrad = ctx.createLinearGradient(cx - radiusX, cy, cx + radiusX, cy);

            bodyGrad.addColorStop(0, `rgb(${clamp(baseCol - 78)}, ${clamp(baseCol - 84)}, ${clamp(baseCol - 78)})`);
            bodyGrad.addColorStop(0.22, `rgb(${clamp(baseCol - 18)}, ${clamp(baseCol - 24)}, ${clamp(baseCol - 26)})`);
            bodyGrad.addColorStop(0.5, `rgb(${clamp(baseCol + 24)}, ${clamp(baseCol + 16)}, ${clamp(baseCol + 4)})`);
            bodyGrad.addColorStop(0.78, `rgb(${clamp(baseCol - 25)}, ${clamp(baseCol - 32)}, ${clamp(baseCol - 34)})`);
            bodyGrad.addColorStop(1, `rgb(${clamp(baseCol - 88)}, ${clamp(baseCol - 94)}, ${clamp(baseCol - 88)})`);

            ctx.beginPath();
            ctx.ellipse(cx, cy, radiusX, radiusY, 0, 0, Math.PI);
            ctx.lineTo(cx - radiusX, topY);
            ctx.ellipse(cx, topY, radiusX, radiusY, 0, Math.PI, 0, true);
            ctx.closePath();
            ctx.fillStyle = bodyGrad;
            ctx.fill();

            // Textura artesanal de crema batida y poros
            ctx.save();
            ctx.clip();
            ctx.strokeStyle = `rgba(130, 115, 105, ${0.24 * lightLevel})`;
            ctx.lineWidth = 1.6;
            for (let y = topY + 10; y < cy; y += 8.5) {
                ctx.beginPath();
                ctx.ellipse(cx, y, radiusX, radiusY, 0, 0, Math.PI);
                ctx.stroke();
            }

            for (let i = 0; i < 95; i++) {
                const seed = i + tierIndex * 131;
                const px = cx + (Math.sin(seed * 127.1) * 0.5 + 0.5) * radiusX * 1.9 - radiusX * 0.95;
                const py = topY + (Math.sin(seed * 311.7) * 0.5 + 0.5) * heightPx;
                const pore = 0.35 + (Math.sin(seed * 74.7) * 0.5 + 0.5) * 0.85;
                ctx.fillStyle = i % 3 === 0
                    ? `rgba(255, 232, 195, ${0.18 * lightLevel})`
                    : `rgba(75, 35, 20, ${0.11 * lightLevel})`;
                ctx.beginPath();
                ctx.ellipse(px, py, pore, pore * 0.65, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // 4. Glaseado blanco con sombra proyectada sobre el bizcocho
            const numDrips = 16 + tierIndex * 4;
            ctx.beginPath();
            ctx.moveTo(cx - radiusX, topY);
            for (let i = 0; i <= numDrips; i++) {
                const angle = (i / numDrips) * Math.PI + rot;
                const localAngle = (i / numDrips) * Math.PI;
                const px = cx - Math.cos(localAngle) * radiusX;
                const py = topY + Math.sin(localAngle) * radiusY;
                const dripLen = 14 + Math.sin(angle * 3.5 + tierIndex) * 11 + Math.cos(angle * 6) * 5;
                ctx.lineTo(px, py + dripLen);
            }
            ctx.lineTo(cx + radiusX, topY);
            ctx.closePath();

            ctx.save();
            ctx.shadowColor = `rgba(20, 8, 4, ${0.55 * lightLevel})`;
            ctx.shadowBlur = 7;
            ctx.shadowOffsetY = 4;

            const icingGrad = ctx.createLinearGradient(cx - radiusX, topY, cx + radiusX, topY + radiusY);
            icingGrad.addColorStop(0, `rgba(${clamp(baseCol - 28)}, ${clamp(baseCol - 32)}, ${clamp(baseCol - 34)}, 0.98)`);
            icingGrad.addColorStop(0.42, `rgba(${clamp(baseCol + 24)}, ${clamp(baseCol + 19)}, ${clamp(baseCol + 10)}, 0.99)`);
            icingGrad.addColorStop(0.72, `rgba(${clamp(baseCol + 4)}, ${clamp(baseCol - 2)}, ${clamp(baseCol - 8)}, 0.99)`);
            icingGrad.addColorStop(1, `rgba(${clamp(baseCol - 38)}, ${clamp(baseCol - 42)}, ${clamp(baseCol - 44)}, 0.98)`);
            ctx.fillStyle = icingGrad;
            ctx.fill();
            ctx.restore();
            ctx.restore();

            // 5. Cara superior iluminada por el fuego de las velas
            const topGrad = ctx.createRadialGradient(
                cx + lightShiftX * 0.6, topY, radiusX * 0.04,
                cx, topY, radiusX
            );
            const warmR = clamp((255 + 45 * ambientLight) * lightLevel * dynamicPulse);
            const warmG = clamp((232 + 15 * ambientLight) * lightLevel * dynamicPulse);
            const warmB = clamp((195 - 20 * ambientLight) * lightLevel * dynamicPulse);

            topGrad.addColorStop(0, `rgb(${warmR}, ${warmG}, ${warmB})`);
            topGrad.addColorStop(0.65, `rgb(${clamp(baseCol + 6)}, ${clamp(baseCol + 2)}, ${clamp(baseCol - 8)})`);
            topGrad.addColorStop(1, `rgb(${clamp(baseCol - 36)}, ${clamp(baseCol - 40)}, ${clamp(baseCol - 44)})`);

            ctx.beginPath();
            ctx.ellipse(cx, topY, radiusX, radiusY, 0, 0, Math.PI * 2);
            ctx.fillStyle = topGrad;
            ctx.fill();

            // Reborde de luz cálida que responde al parpadeo de las velas.
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(cx, topY + radiusY * .10, radiusX * .91, radiusY * .78, 0, Math.PI * 1.08, Math.PI * 1.92);
            ctx.strokeStyle = `rgba(255, 214, 150, ${0.20 * lightLevel})`;
            ctx.lineWidth = Math.max(1, radiusY * .075);
            ctx.shadowColor = 'rgba(255,160,70,.65)'; ctx.shadowBlur = 10 * lightLevel;
            ctx.stroke(); ctx.restore();

            // Reflejo especular satinado en el borde del glaseado
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(cx - radiusX * 0.08, topY - radiusY * 0.18, radiusX * 0.64, radiusY * 0.34, -0.06, Math.PI * 1.08, Math.PI * 1.88);
            ctx.strokeStyle = `rgba(255, 246, 220, ${0.32 * lightLevel})`;
            ctx.lineWidth = Math.max(1.5, radiusY * 0.12);
            ctx.shadowColor = 'rgba(255, 210, 140, 0.8)';
            ctx.shadowBlur = 12 * lightLevel;
            ctx.stroke();
            ctx.restore();

            // 6. Cerezas y perlas rojas con sombras proyectadas y brillo 3D
            const numBerries = 14 + tierIndex * 4;
            const items = [];
            for (let i = 0; i < numBerries; i++) {
                const a = (i / numBerries) * Math.PI * 2 + rot;
                const bx = cx + Math.cos(a) * (radiusX * 0.88);
                const by = topY + Math.sin(a) * (radiusY * 0.88);
                items.push({ bx, by, a, depth: Math.sin(a), type: 'top' });
            }

            const numBasePearls = 20 + tierIndex * 6;
            for (let i = 0; i < numBasePearls; i++) {
                const a = (i / numBasePearls) * Math.PI * 2 + rot;
                if (Math.sin(a) > -0.15) {
                    const px = cx + Math.cos(a) * (radiusX * 1.01);
                    const py = cy + Math.sin(a) * (radiusY * 1.01) - 3;
                    items.push({ bx: px, by: py, a, depth: Math.sin(a) + 2, type: 'base' });
                }
            }

            items.sort((a, b) => a.depth - b.depth);

            items.forEach(item => {
                // Dirección de la sombra desde el centro del piso hacia afuera
                const shadowDirX = Math.cos(item.a) * 3.2;
                const shadowDirY = Math.sin(item.a) * 2.2 + 2;

                if (item.type === 'top') {
                    const r = 7.2 + tierIndex * 0.4;

                    // Sombra proyectada por la cereza
                    ctx.beginPath();
                    ctx.ellipse(item.bx + shadowDirX, item.by + shadowDirY, r * 1.05, r * 0.75, 0, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(22, 2, 4, ${0.58 * lightLevel})`;
                    ctx.fill();

                    // Cuerpo de la cereza
                    const berryGrad = ctx.createRadialGradient(item.bx - r * 0.35, item.by - r * 0.35, r * 0.1, item.bx, item.by, r);
                    berryGrad.addColorStop(0, `rgb(${clamp(255 * lightLevel)}, ${clamp(85 * lightLevel)}, ${clamp(100 * lightLevel)})`);
                    berryGrad.addColorStop(0.5, `rgb(${clamp(195 * lightLevel)}, ${clamp(12 * lightLevel)}, ${clamp(32 * lightLevel)})`);
                    berryGrad.addColorStop(1, `rgb(${clamp(75 * lightLevel)}, 0, ${clamp(10 * lightLevel)})`);

                    ctx.beginPath();
                    ctx.arc(item.bx, item.by, r, 0, Math.PI * 2);
                    ctx.fillStyle = berryGrad;
                    ctx.fill();

                    // Destello especular húmedo
                    ctx.beginPath();
                    ctx.arc(item.bx - r * 0.35, item.by - r * 0.35, r * 0.25, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 250, 240, ${0.88 * lightLevel})`;
                    ctx.fill();
                } else {
                    const pr = 4.8;
                    ctx.beginPath();
                    ctx.arc(item.bx + 1.5, item.by + 2, pr, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(18, 2, 4, ${0.48 * lightLevel})`;
                    ctx.fill();

                    const pearlGrad = ctx.createRadialGradient(item.bx - 1.5, item.by - 1.5, 0.5, item.bx, item.by, pr);
                    pearlGrad.addColorStop(0, `rgb(${clamp(250 * lightLevel)}, ${clamp(55 * lightLevel)}, ${clamp(75 * lightLevel)})`);
                    pearlGrad.addColorStop(1, `rgb(${clamp(105 * lightLevel)}, ${clamp(4 * lightLevel)}, ${clamp(18 * lightLevel)})`);
                    ctx.beginPath();
                    ctx.arc(item.bx, item.by, pr, 0, Math.PI * 2);
                    ctx.fillStyle = pearlGrad;
                    ctx.fill();
                }
            });
        }

        // Velas con sombras radiales direccionales y luz local sobre el glaseado
        function drawDetailedCandles(cx, topSurfaceY, radiusX, radiusY, rot, lightLevel, time) {
            const candleList = candles.map((c, idx) => {
                const a = c.angleOffset + rot;
                const x = cx + Math.cos(a) * (radiusX * 0.62);
                const y = topSurfaceY + Math.sin(a) * (radiusY * 0.62);
                return { ...c, idx, a, x, y, depth: Math.sin(a) };
            });

            candleList.sort((a, b) => a.depth - b.depth);

            candleList.forEach(c => {
                const candleW = 9;
                const candleH = 42;
                const flickerSway = Math.sin(time * 0.025 + c.flickerSeed) * 2.5;

                // 1. Luz local proyectada por esta vela sobre el glaseado
                if (c.lit) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    const localGlow = ctx.createRadialGradient(c.x, c.y - 4, 2, c.x, c.y, 68);
                    localGlow.addColorStop(0, `rgba(255, 200, 110, ${0.32 * c.litProgress})`);
                    localGlow.addColorStop(0.45, `rgba(255, 115, 30, ${0.14 * c.litProgress})`);
                    localGlow.addColorStop(1, 'rgba(255, 60, 0, 0)');
                    ctx.fillStyle = localGlow;
                    ctx.beginPath();
                    ctx.ellipse(c.x, c.y, 68, 28, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // 2. Sombra radial alargada que apunta hacia afuera del círculo de fuego
                const shadowAngle = c.a;
                const shadowLen = 22 + Math.sin(time * 0.03 + c.flickerSeed) * 2;
                const sx = c.x + Math.cos(shadowAngle) * (shadowLen * 0.55) + flickerSway * 0.4;
                const sy = c.y + Math.sin(shadowAngle) * (shadowLen * 0.25) + 2;

                ctx.save();
                ctx.filter = 'blur(2.5px)';
                ctx.beginPath();
                ctx.ellipse(sx, sy, shadowLen * 0.55, 4.2, Math.sin(shadowAngle) * 0.35, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(25, 6, 2, ${0.58 * lightLevel})`;
                ctx.fill();
                ctx.restore();

                // 3. Cuerpo cilíndrico de la vela iluminado desde arriba
                const cGrad = ctx.createLinearGradient(c.x - candleW / 2, c.y - candleH, c.x + candleW / 2, c.y);
                cGrad.addColorStop(0, `rgb(${clamp(255 * lightLevel)}, ${clamp(235 * lightLevel)}, ${clamp(200 * lightLevel)})`);
                cGrad.addColorStop(0.5, `rgb(${clamp(225 * lightLevel)}, ${clamp(215 * lightLevel)}, ${clamp(205 * lightLevel)})`);
                cGrad.addColorStop(1, `rgb(${clamp(145 * lightLevel)}, ${clamp(138 * lightLevel)}, ${clamp(135 * lightLevel)})`);

                ctx.fillStyle = cGrad;
                ctx.beginPath();
                ctx.roundRect(c.x - candleW / 2, c.y - candleH, candleW, candleH, 2);
                ctx.fill();
                // Cera derretida: pequeños chorritos que capturan los reflejos de la llama.
                ctx.save();
                ctx.fillStyle = `rgba(255, 247, 220, ${0.92 * lightLevel})`;
                const waxSeed = c.flickerSeed;
                for (let w = 0; w < 2; w++) {
                    const wx = c.x + (w === 0 ? -2.8 : 2.5);
                    const drop = 4 + (Math.sin(waxSeed + w * 3.1) * .5 + .5) * 7;
                    ctx.beginPath();
                    ctx.moveTo(wx - 1.5, c.y - candleH + 4);
                    ctx.quadraticCurveTo(wx - 2, c.y - candleH + drop, wx, c.y - candleH + drop + 2);
                    ctx.quadraticCurveTo(wx + 2, c.y - candleH + drop, wx + 1.2, c.y - candleH + 4);
                    ctx.closePath(); ctx.fill();
                }
                ctx.strokeStyle = `rgba(255,255,245,${0.48 * lightLevel})`;
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(c.x - 2.6, c.y - candleH + 5); ctx.lineTo(c.x - 2.6, c.y - 9); ctx.stroke();
                ctx.restore();

                // Franjas rojas espirales
                ctx.save();
                ctx.beginPath();
                ctx.roundRect(c.x - candleW / 2, c.y - candleH, candleW, candleH, 2);
                ctx.clip();
                ctx.strokeStyle = `rgba(235, 15, 50, ${0.92 * lightLevel})`;
                ctx.lineWidth = 3.5;
                for (let sy2 = c.y - candleH - 12; sy2 < c.y + 12; sy2 += 12) {
                    ctx.beginPath();
                    ctx.moveTo(c.x - 9, sy2);
                    ctx.lineTo(c.x + 9, sy2 + 8);
                    ctx.stroke();
                }
                ctx.restore();

                // Borde superior cálido (cera derritiéndose con la luz)
                ctx.beginPath();
                ctx.ellipse(c.x, c.y - candleH + 1, candleW / 2, 2.2, 0, Math.PI, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 240, 195, ${0.85 * lightLevel})`;
                ctx.fill();

                // Mecha
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(c.x, c.y - candleH);
                ctx.lineTo(c.x, c.y - candleH - 7);
                ctx.stroke();

                // 4. Llama titilante
                if (c.lit) {
                    candles[c.idx].litProgress = Math.min(1, candles[c.idx].litProgress + 0.025);
                    drawCinematicFlame(c.x, c.y - candleH - 6, candles[c.idx].litProgress * 0.88, time, c.flickerSeed);
                    if (Math.random() < 0.018) spawnParticle(c.x, c.y - candleH - 28, 'smoke');
                    if (Math.random() < 0.075) spawnParticle(c.x + (Math.random() - .5) * 10, c.y - candleH - 25, 'ember');
                }
            });
        }

        // Bucle principal de animación
        function animate(now) {
            const elapsed = (now - startTime) / 1000;
            ctx.clearRect(0, 0, width, height);

            // Motas suspendidas en el aire: profundidad cinematográfica, casi imperceptible.
            ctx.save();
            for (const d of dust) {
                d.y -= d.speed;
                d.x += Math.sin(now * 0.00035 + d.phase) * 0.12;
                if (d.y < -8) { d.y = height + 8; d.x = Math.random() * width; }
                const shimmer = 0.12 + (Math.sin(now * 0.0015 + d.phase) + 1) * 0.10;
                ctx.fillStyle = `rgba(255,205,135,${shimmer})`;
                ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();

            const scaleFactor = Math.min(width / 560, height / 680, 1.25);
            const cx = width / 2;
            const baseCakeY = height * 0.79;

            const t1RX = 150 * scaleFactor, t1RY = 44 * scaleFactor, t1H = 75 * scaleFactor;
            const t2RX = 112 * scaleFactor, t2RY = 34 * scaleFactor, t2H = 66 * scaleFactor;
            const t3RX = 76 * scaleFactor,  t3RY = 23 * scaleFactor, t3H = 58 * scaleFactor;

            const t1Y = baseCakeY;
            const t2Y = t1Y - t1H + 4 * scaleFactor;
            const t3Y = t2Y - t2H + 4 * scaleFactor;
            const topSurfaceY = t3Y - t3H;

            // Secuencia de encendido con llama mística
            let magicalFlameActive = false;
            let mFlameX = cx;
            let mFlameY = topSurfaceY - 110 * scaleFactor;
            let mFlameScale = 0;

            if (elapsed >= 1.8 && elapsed < 11.8) {
                magicalFlameActive = true;
                if (elapsed < 3.5) {
                    const p = (elapsed - 1.8) / 1.7;
                    mFlameScale = Math.min(1, p * 1.5);
                    mFlameX += Math.sin(p * Math.PI * 2) * 18;
                    mFlameY += Math.cos(p * Math.PI * 2) * 8;
                    if (p < 0.45 && Math.random() < 0.75) {
                        spawnParticle(mFlameX, mFlameY, 'spark');
                    }
                } else if (elapsed < 10.5) {
                    mFlameScale = 1;
                    const progress = (elapsed - 3.5) / 7.0;
                    const targetIndex = Math.min(numCandles - 1, Math.floor(progress * numCandles));
                    const subProgress = (progress * numCandles) - targetIndex;

                    const targetAngle = candles[targetIndex].angleOffset + rotationAngle;
                    const targetX = cx + Math.cos(targetAngle) * (t3RX * 0.62);
                    const targetY = topSurfaceY + Math.sin(targetAngle) * (t3RY * 0.62) - 48;

                    const ease = 1 - Math.pow(1 - Math.min(1, subProgress * 1.6), 3);
                    mFlameX = mFlameX + (targetX - mFlameX) * ease;
                    mFlameY = mFlameY + (targetY - mFlameY) * ease;

                    if (subProgress > 0.45 && !candles[targetIndex].lit) {
                        candles[targetIndex].lit = true;
                        for (let s = 0; s < 14; s++) {
                            spawnParticle(targetX, targetY, 'spark');
                        }
                    }
                } else {
                    const outP = (elapsed - 10.5) / 1.3;
                    mFlameY -= outP * 130;
                    mFlameScale = Math.max(0, 1 - outP * 1.3);
                }
            }

            // Iluminación global progresiva con titileo orgánico
            const litCount = candles.filter(c => c.lit).length;
            const flameFlickerBoost = litCount > 0 ? Math.sin(now * 0.019) * 0.025 : 0;
            const targetLight = Math.min(1, (litCount / numCandles) * 0.94 + (magicalFlameActive ? 0.28 * mFlameScale : 0) + flameFlickerBoost);
            ambientLight += (targetLight - ambientLight) * 0.055;

            // Rotación suave de la torta
            if (elapsed > 11.5) {
                const rotSpeed = Math.min(0.0055, (elapsed - 11.5) * 0.0018);
                rotationAngle += rotSpeed;
            }

            // Aparición de las 4 líneas con 3.5 segundos de pausa entre cada una
            if (elapsed > 12.5 && !textTriggered) {
                textTriggered = true;
                setTimeout(() => document.getElementById('msg1').classList.add('visible'), 0);
                setTimeout(() => document.getElementById('msg2').classList.add('visible'), 3500);
                setTimeout(() => document.getElementById('msg3').classList.add('visible'), 7000);
                setTimeout(() => document.getElementById('msg4').classList.add('visible'), 10500);
            }

            // 1. Atmósfera de luz cálida cinematográfica y sombra en la mesa
            if (ambientLight > 0.01) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const bgGlow = ctx.createRadialGradient(cx, topSurfaceY - 15, 10, cx, topSurfaceY + 70, 390 * scaleFactor);
                bgGlow.addColorStop(0, `rgba(255, 190, 105, ${0.40 * ambientLight})`);
                bgGlow.addColorStop(0.45, `rgba(245, 92, 32, ${0.17 * ambientLight})`);
                bgGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = bgGlow;
                ctx.fillRect(0, 0, width, height);
                ctx.restore();

                // Sombra proyectada por el plato sobre la superficie oscura
                ctx.save();
                ctx.filter = 'blur(12px)';
                ctx.beginPath();
                ctx.ellipse(cx, t1Y + 18 * scaleFactor, t1RX * 1.32, t1RY * 1.28, 0, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 0, 0, ${0.92 * ambientLight})`;
                ctx.fill();
                ctx.restore();

                // Plato dorado con reflejo metálico
                ctx.beginPath();
                ctx.ellipse(cx, t1Y + 9 * scaleFactor, t1RX * 1.2, t1RY * 1.2, 0, 0, Math.PI * 2);
                const plateGrad = ctx.createLinearGradient(cx - t1RX * 1.2, t1Y, cx + t1RX * 1.2, t1Y);
                plateGrad.addColorStop(0, `rgba(65, 48, 15, ${ambientLight})`);
                plateGrad.addColorStop(0.3, `rgba(195, 155, 45, ${ambientLight})`);
                plateGrad.addColorStop(0.5, `rgba(245, 210, 95, ${ambientLight})`);
                plateGrad.addColorStop(0.7, `rgba(185, 145, 40, ${ambientLight})`);
                plateGrad.addColorStop(1, `rgba(55, 40, 12, ${ambientLight})`);
                ctx.fillStyle = plateGrad;
                ctx.fill();
            }

            // 2. Renderizar los 3 pisos de la torta con oclusión ambiental y sombras dinámicas
            if (ambientLight > 0.01) {
                drawCinemaCakeTier(cx, t1Y, t1RX, t1RY, t1H, rotationAngle, ambientLight, 2, now * 0.008);
                drawCinemaCakeTier(cx, t2Y, t2RX, t2RY, t2H, -rotationAngle * 0.5 + rotationAngle, ambientLight, 1, now * 0.009);
                drawCinemaCakeTier(cx, t3Y, t3RX, t3RY, t3H, rotationAngle, ambientLight, 0, now * 0.01);

                // 3. Renderizar las 6 velas y sus llamas cinematográficas
                drawDetailedCandles(cx, topSurfaceY, t3RX, t3RY, rotationAngle, ambientLight, now);
            }

            // 4. Llama mística flotante central
            if (magicalFlameActive) {
                drawCinematicFlame(mFlameX, mFlameY, mFlameScale * 1.45, now, 5);
            }

            // 5. Brasas, chispas y humo con movimiento y desenfoque independientes.
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx + Math.sin(now * .002 + p.phase) * (p.type === 'smoke' ? .22 : .06);
                p.y += p.vy;
                p.vy += p.gravity || 0;
                p.vx *= p.type === 'smoke' ? .995 : .985;
                p.life -= p.decay;
                if (p.life <= 0) { particles.splice(i, 1); continue; }

                if (p.type === 'spark' || p.type === 'ember') {
                    ctx.save(); ctx.globalCompositeOperation = 'lighter';
                    const alpha = p.life * (p.type === 'ember' ? .72 : 1);
                    const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3.5);
                    glow.addColorStop(0, `rgba(255,245,190,${alpha})`);
                    glow.addColorStop(.28, `rgba(255,150,45,${alpha * .8})`);
                    glow.addColorStop(1, 'rgba(255,55,5,0)');
                    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 3.5, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = `rgba(255,${Math.floor(145 + p.life * 100)},${Math.floor(45 + p.life * 80)},${alpha})`;
                    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(.25, p.size * p.life), 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                } else {
                    ctx.save(); ctx.filter = `blur(${Math.max(1.5, p.size * .22)}px)`;
                    const smokeGrad = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, p.size * 2.2);
                    smokeGrad.addColorStop(0, `rgba(190,175,160,${p.life * .075})`);
                    smokeGrad.addColorStop(1, 'rgba(80,65,55,0)');
                    ctx.fillStyle = smokeGrad; ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 2.2, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                }
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
